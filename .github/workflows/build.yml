name: Build Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract ZIP File
      shell: powershell
      run: |
        $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
        if ($zip) {
            Write-Host "Extracting ZIP: $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath ./extracted -Force
        }

    - name: Clean Stray Backticks from CS Files
      shell: powershell
      run: |
        Get-ChildItem -Path ./extracted -Recurse -Filter "*.cs" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '`') {
                Write-Host "Cleaning backticks from: $($_.Name)"
                $cleaned =$content -replace '```csharp', '' -replace '```', '' -replace '`', ''
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }

    - name: Find and Publish App
      shell: powershell
      run: |
        $proj = Get-ChildItem -Recurse -Filter "AutomationStudio.csproj" | Select-Object -First 1
        if (-not $proj) {
            Write-Error "AutomationStudio.csproj file was not found!"
            exit 1
        }
        Write-Host "Found project at: $($proj.FullName)"
        dotnet publish $proj.FullName -c Release -r win-x64 --self-contained true -o ./output

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutomationStudio-Standalone
        path: ./output/
